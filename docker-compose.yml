services:
  postgres:
    image: postgres:17
    container_name: eventlead-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventlead
      POSTGRES_PASSWORD: eventlead_password
      POSTGRES_DB: eventlead
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
